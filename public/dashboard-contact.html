<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Team | NexaCore Dashboard</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
  <link rel="stylesheet" href="CSS/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .contact-inner { max-width: 680px; }
    .contact-inner h1 { font-size: 28px; color: var(--navy); margin: 6px 0 4px; }
    .contact-inner .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

    .contact-form-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 4px 20px rgba(0,0,0,.04);
    }
    .contact-form-card .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .contact-form-card .form-group { margin-bottom: 18px; }
    .contact-form-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .contact-form-card input,
    .contact-form-card select,
    .contact-form-card textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--navy);
      background: #fafafa;
      box-sizing: border-box;
      transition: border .2s;
      font-family: inherit;
    }
    .contact-form-card input:focus,
    .contact-form-card select:focus,
    .contact-form-card textarea:focus {
      outline: none;
      border-color: var(--sky-blue);
      background: white;
    }
    .contact-form-card textarea { resize: vertical; min-height: 130px; }
    .contact-submit-btn {
      background: var(--sky-blue);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }
    .contact-submit-btn:hover { opacity: .88; }
    .contact-submit-btn:disabled { opacity: .55; cursor: default; }
    .form-status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .form-status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; display: block; }
    .form-status.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; display: block; }

    .contact-info-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    .info-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .info-card i { font-size: 20px; color: var(--sky-blue); margin-bottom: 10px; }
    .info-card h4 { font-size: 13px; color: var(--navy); font-weight: 600; margin-bottom: 4px; }
    .info-card p { font-size: 12px; color: var(--muted); }
    @media (max-width: 768px) {
      .contact-form-card .form-row { grid-template-columns: 1fr; }
      .contact-info-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="dashboard-body">
<div class="dashboard-shell">

  <!-- Sidebar -->
  <aside class="dashboard-sidebar">
    <a class="logo" href="/">Nexa<span>Core</span></a>
    <nav>
      <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Overview</a>
      <a href="my-services.html"><i class="fa-solid fa-layer-group"></i> My Services</a>
      <a class="active" href="dashboard-contact.html"><i class="fa-solid fa-message"></i> Contact Team</a>
      <a href="dashboard-connect-team.html"><i class="fa-solid fa-users"></i> Connect Team</a>
      <a href="dashboard-careers.html"><i class="fa-solid fa-briefcase"></i> Careers</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="dashboard-main">
    <span class="section-label">Client Portal</span>
    <div class="contact-inner">
      <h1>Contact Our Team</h1>
      <p class="sub">Have a question or need support? We typically respond within 24 hours.</p>

      <div class="contact-form-card">
        <form id="contactForm" onsubmit="handleContact(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" placeholder="Your name" required/>
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required/>
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What's this about?" required/>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Describe your question or issue in detail…" required></textarea>
          </div>
          <button type="submit" class="contact-submit-btn">Send Message</button>
          <div class="form-status" id="contactStatus"></div>
        </form>
      </div>

      <div class="contact-info-cards">
        <div class="info-card">
          <i class="fa-solid fa-envelope"></i>
          <h4>Email</h4>
          <p>hello@nexacore.com</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-clock"></i>
          <h4>Response Time</h4>
          <p>Within 24 hours</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-shield-halved"></i>
          <h4>Support Hours</h4>
          <p>Mon – Fri, 9am – 6pm</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="JS/script.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;
  // Pre-fill name and email from session
  const nameEl  = document.getElementById('name');
  const emailEl = document.getElementById('email');
  if (nameEl  && user.name)  nameEl.value  = user.name;
  if (emailEl && user.email) emailEl.value = user.email;
})();
</script>
</body>
</html>
