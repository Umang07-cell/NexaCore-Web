<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | NexaCore</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #0c1b33; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }
    .admin-login-box { background: #fff; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .admin-login-box h1 { color: #0c1b33; font-size: 22px; margin-bottom: 4px; }
    .admin-login-box h1 span { color: #0ea5e9; }
    .admin-login-box p { color: #64748b; font-size: 13px; margin-bottom: 28px; }
    .admin-login-box label { display: block; font-size: 13px; font-weight: 600; color: #0c1b33; margin-bottom: 6px; }
    .admin-login-box input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 18px; box-sizing: border-box; outline: none; transition: border 0.2s; }
    .admin-login-box input:focus { border-color: #0ea5e9; }
    .admin-login-box button { width: 100%; padding: 13px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .admin-login-box button:hover { background: #0284c7; }
    .admin-login-box button:disabled { background: #94a3b8; cursor: not-allowed; }
    .error-msg { background: #fef2f2; color: #dc2626; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: #f0f9ff; color: #0ea5e9; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="admin-login-box">
    <div class="badge"><i class="fa-solid fa-shield-halved"></i> Admin Access Only</div>
    <h1>Nexa<span>Core</span> Admin</h1>
    <p>Sign in to manage the platform.</p>
    <div class="error-msg" id="errorMsg"></div>
    <label>Email</label>
    <input type="email" id="adminEmail" placeholder="Email address" autocomplete="off"/>
    <label>Password</label>
    <input type="password" id="adminPassword" placeholder="Password" autocomplete="off"/>
    <button id="loginBtn" onclick="adminLogin()">Sign In</button>
  </div>

  <script>
    fetch('/api/admin/me', { credentials: 'include' })
      .then(r => r.json())
      .then(d => { if (d.success) window.location.replace('/admin.html'); })
      .catch(() => {});

    async function adminLogin() {
      const email    = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errorEl  = document.getElementById('errorMsg');
      const btn      = document.getElementById('loginBtn');

      errorEl.style.display = 'none';
      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message || 'Invalid credentials.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        window.location.replace('/admin.html');
      } catch (e) {
        errorEl.textContent = 'Network error. Try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
  </script>
</body>
</html>
