<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - NexaCore</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/auth.css">
  <link rel="stylesheet" href="CSS/responsive.css">
  <style>
    .auth-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .auth-success {
      display: none;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #16a34a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .otp-demo-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #16a34a;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 14px;
      text-align: center;
    }
    .otp-demo-box strong {
      font-size: 24px;
      display: block;
      letter-spacing: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="logo">Nexa<span>Core</span></a>
    <h2>Create Account</h2>
    <p class="auth-sub">Join NexaCore today — verify your email to get started</p>

    <div class="auth-error"   id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="John Doe" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Min 6 characters" autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password"/>
    </div>

    <button class="auth-btn" onclick="handleSignup()">Create Account</button>

    <!-- Dev mode OTP display (only shown when SMTP not configured) -->
    <div class="otp-demo-box" id="otpDemoBox">
      <span>⚠️ DEV MODE — No SMTP configured. Your OTP is:</span>
      <strong id="otpDisplay"></strong>
      <span style="font-size:12px;">Redirecting to verification…</span>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>
<script src="JS/script.js"></script>
</body>
</html>
